<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aplikasi Data Kendaraan</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="css/app.css" rel="stylesheet" />
  </head>
  <body>
    <header class="app-header">
      <span class="app-logo"></span>
      <h1 class="app-title">Aplikasi Data Kendaraan</h1>
    </header>

    <main class="container">
      <section class="filter-panel">
        <form id="filterForm">
          <div class="filter-fields">
            <div>
              <label for="filterNoRegistrasi" class="form-label"
                >No Registrasi</label
              >
              <input
                type="text"
                class="form-control"
                id="filterNoRegistrasi"
                name="noRegistrasi"
                maxlength="20"
                autocomplete="off"
              />
            </div>
            <div>
              <label for="filterNamaPemilik" class="form-label"
                >Nama Pemilik</label
              >
              <input
                type="text"
                class="form-control"
                id="filterNamaPemilik"
                name="namaPemilik"
                maxlength="100"
                autocomplete="off"
              />
            </div>
          </div>
        </form>
      </section>

      <div class="filter-actions">
        <button type="button" class="btn btn-primary" id="btnSearch">
          Search
        </button>
        <a href="tambah.html" class="btn btn-primary" id="btnAdd">Add</a>
      </div>

      <section class="table-responsive">
        <table
          class="table table-bordered table-hover align-middle mb-0"
          id="kendaraanTable"
        >
          <thead>
            <tr>
              <th scope="col">No</th>
              <th scope="col">No Registrasi</th>
              <th scope="col">Nama Pemilik</th>
              <th scope="col">Alamat</th>
              <th scope="col">Merk Kendaraan</th>
              <th scope="col">Tahun</th>
              <th scope="col" class="text-end">Kapasitas</th>
              <th scope="col">Warna</th>
              <th scope="col">Bahan Bakar</th>
              <th scope="col">Aksi</th>
            </tr>
          </thead>
          <tbody id="kendaraanBody"></tbody>
        </table>
        <div class="empty-state d-none" id="emptyState">
          Data kendaraan tidak ditemukan.
        </div>
      </section>
    </main>

    <div class="toast-container" id="toastContainer"></div>

    <div
      class="modal fade"
      id="deleteModal"
      tabindex="-1"
      aria-labelledby="deleteModalText"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-body">
            <p id="deleteModalText" class="mb-0"></p>
          </div>
          <div class="modal-footer justify-content-end">
            <button type="button" class="btn btn-primary" id="btnDeleteOk">
              OK
            </button>
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Batal
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/list.js"></script>
  </body>
</html>
